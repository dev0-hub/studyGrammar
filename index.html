 f:"He/She/It + verb<b>-s / -es / -ies</b>",x:["She works here.","He watches TV.","It studies hard → She studies.","Computers are powerful machines. → A computer is a powerful machine.","Do cars have airbags? → Does a car have an airbag?"],w:["ကိုယ်ပိုင်းတစ်ခုတည်း (he/she/it) သို့ ပြောင်းရာတွင် နာမ်ကို singular ပြောင်းပါ (a/an ထည့်ပါ)။ ကြိယာတွင် -s/-es ထည့်ပါ၊ have→has၊ are→is၊ do→does သုံးပါ၊ their→its ပြောင်းပါ။ မေးခွန်းတွင် Does နောက်ကြိယာကို မူလပုံစံအတိုင်း ထားပါ။ စာကြောင်းတိုင်းကို ပြောင်းပြီးမှ ပြန်စစ်ပါ။","Subject ကို plural မှ singular သို့ အရင်ပြောင်းပါ (They→He/She, dogs→dog)၊ ထို့နောက် verb တွင် -s/-es ထည့်ပါ (watch→watches, have→has, do→does, eat→eats)။ his/her/its ကဲ့သို့ possessive များကိုလည်း လိုက်ပြောင်းပါ။ ပြောင်းပြီးတိုင်း subject နှင့် verb ကိုက်ညီမှု ပြန်စစ်ပါ။","Subject ကို များပြားမှုကနေ တစ်ခုတည်း (he/she/it) သို့ ပြောင်းတဲ့အခါ subject တစ်ခုလုံး၊ verb (-s/-es)၊ နာမ်စားပိုင်ဆိုင်မှု (their → his/her/its) ကို အကုန်ပြောင်းရပါမယ်။ မေးခွန်းမှာ Do → Does ဖြစ်ပြီး main verb က မူလအတိုင်းပါ။","I/we/they ကို he/she/it သို့ ပြောင်းပြီး ကြိယာတွင် -s/-es/-ies ထည့်ရမည်ကို မလုပ်ခဲ့ပါ။ drink→drinks၊ watch→watches၊ mix→mixes၊ try→tries။ ဝါကျတစ်ကြောင်းရှိ subject အားလုံးကို တစ်ခုချင်းစစ်ပါ။ -ch, -sh, -x, -s, -o ဖြင့်ဆုံးလျှင် -es၊ ဗျည်း+y ဆိုလျှင် -ies သုံးပါ။"],

    ["He ___ TV at night.",["watch","watchs","watches","watching"],2,"ch နဲ့ဆုံးတဲ့အတွက် -es ထည့်ပါ။"]]},
{t:"Interrogative",m:"မေးခွန်းပုံစံ",

 S.k=k;var A=Q(),q=A[k],n=A.length,a=S.ans[k],pc=Math.round((k+1)/n*100),ttl=S.m=='v'?V[S.vi].t:L[S.i].t;
 app.innerHTML=TOP('Quizzes')+'<h1>'+E(ttl)+' — Question '+(k+1)+' of '+n+'</h1><p class="sub">One question closer to confident English.</p><div class="qm"><span class="chip">'+(S.m=='v'?'Vocabulary':'Grammar')+(S.ai?' · AI':'')+'</span><span class="tmr">⏱ <b id="tm">00:00</b></span></div><div class="qp"><span>Question '+(k+1)+' of '+n+'</span><span>'+pc+'%</span></div><div class="prog"><i style="width:'+pc+'%"></i></div><div class="card qc"><small class="eyebrow">CHOOSE THE CORRECT ANSWER</small><p class="q">'+E(q[0])+'</p>'+q[1].map(function(o,j){return'<button class="opt" onclick="sel('+j+')"><i>'+'ABCD'[j]+'</i>'+E(o)+'</button>'}).join('')+'<div class="fb" id="fb"></div></div><div class="qn"><button class="btn ghost" onclick="'+(k>0?'quiz('+(k-1)+',1)':(S.m=='v'?'vlearn('+S.vi+')':'learn('+S.i+')'))+'">← Previous</button><span><button class="btn ghost" id="sb2" onclick="sub()">Submit answer</button><button class="btn" onclick="nxt()">'+(k==n-1?'Finish':'Next')+' →</button></span></div><p class="note">🛡 Your progress is saved. Need a hint? Ask your AI tutor without leaving this question.</p>';
 S.sel=a!=null?a:null;if(a!=null)show(a);window.scrollTo(0,0)}
function sel(j){if(S.ans[S.k]!=null)return;S.sel=j;document.querySelectorAll('.opt').forEach(function(b,n){b.classList.toggle('on',n==j)})}
function sub(){if(S.sel==null||S.ans[S.k]!=null)return;var j=S.sel,q=Q()[S.k],ok=j==q[2];S.ans[S.k]=j;if(ok){S.pts+=10;S.ok++}rec(S.m=='v'?'v'+S.vi:'g'+S.i,ok,q[0]);show(j)}
function show(j){var q=Q()[S.k],ok=j==q[2];document.querySelectorAll('.opt').forEach(function(b,n){b.disabled=true;b.classList.remove('on');if(n==q[2])b.classList.add('ok');else if(n==j)b.classList.add('no')});
 document.getElementById('fb').innerHTML='<span style="color:var(--'+(ok?'ok':'no')+')">'+(ok?'✔ မှန်ပါတယ်! +10 မှတ်':'✘ မှားသွားပါတယ်')+'</span><br>'+E(q[3])+'<button class="btn ghost ai" style="margin-top:8px" onclick="tg()">🤖 Ask AI to explain</button>';document.getElementById('sb2').disabled=true}
function nxt(){if(S.ans[S.k]==null){sub();return}if(S.k==Q().length-1)done();else quiz(S.k+1)}
setInterval(function(){var e=document.getElementById('tm');if(e&&S.t0){var t=Math.floor((Date.now()-S.t0)/1000);e.textContent=('0'+Math.floor(t/60)).slice(-2)+':'+('0'+t%60).slice(-2)}},1000);
function done(){setTimeout(sp,0);
 var n=Q().length,s=S.ok,st=s==n?3:s>=n*.6?2:s>0?1:0;if(!S.ai&&(S.stars[S.i]==null||st>S.stars[S.i]))S.stars[S.i]=st;
 var all=S.stars.filter(function(x){return x!=null}).length==8;
 app.innerHTML='<div class="card"><div class="big">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</div><h2 style="text-align:center">'+(st==3?'အရမ်းတော်ပါတယ်!':st>=1?'ကောင်းပါတယ်၊ ထပ်ကြိုးစားပါ။':'စိတ်မညစ်ပါနဲ့၊ ပြန်လေ့လာကြည့်ပါ။')+'</h2><p style="text-align:center;margin:0">မှန်သည် '+s+'/'+n+' · စုစုပေါင်း '+S.pts+' မှတ်'+(all?'<br>🎉 သင်ခန်းစာ ၈ ခုလုံး ပြီးပါပြီ!':'')+'</p></div>'+(S.m=='g'&&S.i<7?'<button class="btn" onclick="learn('+(S.i+1)+')">နောက်သင်ခန်းစာ</button>':'')+''+(S.m=='g'?'<button class="btn ghost ai" onclick="gen(this)">🤖 AI နဲ့ မေးခွန်းအသစ် ၃ ခု ယူမယ်</button>':'')+'<button class="btn ghost" onclick="'+(S.m=='v'?'vq()':'quiz(0)')+'">ပြန်ကစားမယ်</button><button class="btn ghost" onclick="map()">မီနူးသို့</button>';
}
map();
</script>
</body>
</html>
